services:
  backend:
    #build: ./mentorship_platform
    #container_name: backend
    image: nick313/mvp-backend:latest


    env_file:
      - ./mentorship_platform/.env

    ports:
      - "8000:8000"

    restart: unless-stopped

    networks:
      - app-network

  frontend:
    #build: ./frontend
    image: nick313/mvp-frontend:latest
    container_name: frontend

    ports:
      - "3000:3000" #localohost to nginx cont. port mapping 

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - app-network #for containers to talk to each other

networks:
  app-network:
    driver: bridge
