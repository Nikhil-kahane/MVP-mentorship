name: Frontend CI

on:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  
  pull_request:
    branches:
      - develop
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
            
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           
           
      - name: Install dependencies
        run: npm ci
        
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
            scan-type: fs
            scan-ref: frontend
            severity: CRITICAL,HIGH
            exit-code: ''
            
      - name: Test
        run: npm test
        
  docker-build-scan-push:
    needs: build
    runs-on: ubuntu-latest
   
    defaults:
    run:
      working-directory: frontend
    
    steps:
      - name: Build
        run: npm run build
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: validate dockerfile
        run: docker buildx build --check .
        
      - name: build docker image 
        run: docker buildx build --load -t mvp-frontend:test .
        
      - name: Trivy docker image scan
        uses: aquasecurity/trivy-action@master
        with:
            scan-type: image
            image-ref: mvp-frontend:test 
            severity: CRITICAL,HIGH
            exit-code: '0'
            
      - name: login to docker hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
            
      - name: Tag Docker image
        run: docker tag mvp-frontend:test nick313/mvp-frontend:latest
        
      - name: Tag Docker image with commit SHA
        run: docker tag mvp-frontend:test nick313/mvp-frontend:${{ github.sha }}
        
      - name: push docker image
        run: |
          docker push nick313/mvp-frontend:latest
          docker push nick313/mvp-frontend:${{ github.sha }}
        
      