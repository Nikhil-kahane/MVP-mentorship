name: Backend CI

on:
  push:
    branches:
      - develop
    paths:
      - 'mentorship_platform/**'
      - '.github/workflows/ci-backend.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'mentorship_platform/**'
      - '.github/workflows/ci-backend.yml'



jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mentorship_platform

    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .
        continue-on-error: true 

      - name: Run Backend Tests
        run: python manage.py test



  docker-build-scan-and-push:
    needs: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mentorship_platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile
        run: docker buildx build --check .

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: mentorship_platform
          load: true
          tags: mvp-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: mvp-backend:test
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag mvp-backend:test nick313/mvp-backend:latest

      - name: Tag Docker image with commit SHA
        run: docker tag mvp-backend:test nick313/mvp-backend:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push nick313/mvp-backend:latest
          docker push nick313/mvp-backend:${{ github.sha }}




         



